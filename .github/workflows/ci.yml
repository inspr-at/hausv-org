name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # Pull the newest patch of the go.mod minor so stdlib CVE fixes land
          # (HAUSV-139: the crypto/tls fix shipped in a patch release).
          check-latest: true
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race ./...

      - name: Build
        run: go build ./...

  govulncheck:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
      - name: govulncheck
        run: |
          # Deliberately pinned: scanner upgrades are reviewed instead of
          # changing underneath an otherwise identical commit.
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck -version
          govulncheck ./...

  browser-role-qa:
    name: Browser roles + mobile
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/snapshot/package-lock.json

      - name: Install fish
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fish

      - name: Verify fail-closed release contract
        run: fish scripts/test-deploy.fish

      - name: Install browser QA dependencies
        run: |
          npm --prefix scripts/snapshot ci --ignore-scripts --no-audit --no-fund
          npm --prefix scripts/snapshot exec -- playwright install --with-deps chromium

      - name: Run resident/admin browser gate
        env:
          CI: "true"
          HV_QA_CI_CORE: "true"
          HV_QA_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/browser-role-qa
        run: fish scripts/qa-main-flows.fish

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: browser-role-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/browser-role-qa
          if-no-files-found: warn
          retention-days: 7

  docker:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        # Never pushed — this only proves the Dockerfile still builds, which
        # `go test` cannot (HAUSV-139).
        run: docker build --build-arg APP_VERSION=ci --build-arg GIT_COMMIT="${GITHUB_SHA::7}" -t hausv-org:ci ./
