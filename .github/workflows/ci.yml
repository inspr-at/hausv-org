name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    env:
      HAUSV_TEST_POSTGRES_DSN: postgres://hausv_ci:hausv_ci@127.0.0.1:5432/hausv_ci?sslmode=disable
      HAUSV_TEST_POSTGRES_REQUIRED: "true"
      # Runs the store and server suites against PostgreSQL as well as SQLite.
      # Gated separately until 0.97.0 because the store layer keyed on tenant_slug
      # and could not execute there; it now addresses rows by tenant_id and passes.
      # Without this the two-tenant isolation oracle silently runs on SQLite, where
      # there is no row-level security to observe — it was measured returning ok in
      # 0.697s against a dead port, i.e. never dialling at all.
      HAUSV_STORE_TEST_POSTGRES: "1"
    services:
      postgres:
        image: postgres:17.6-alpine3.22@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_DB: hausv_ci
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres --dbname hausv_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          # Pull the newest patch of the go.mod minor so stdlib CVE fixes land
          # (HAUSV-139: the crypto/tls fix shipped in a patch release).
          check-latest: true
          cache: true

      - name: Create unprivileged PostgreSQL test role
        run: |
          postgres_image='postgres:17.6-alpine3.22@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94'
          docker run --rm --network host --env PGPASSWORD=postgres "$postgres_image" \
            psql --host 127.0.0.1 --username postgres --dbname postgres --set ON_ERROR_STOP=1 \
            --command "CREATE ROLE hausv_ci LOGIN PASSWORD 'hausv_ci' NOSUPERUSER NOBYPASSRLS"
          docker run --rm --network host --env PGPASSWORD=postgres "$postgres_image" \
            psql --host 127.0.0.1 --username postgres --dbname postgres --set ON_ERROR_STOP=1 \
            --command "ALTER DATABASE hausv_ci OWNER TO hausv_ci"

      - name: Verify PostgreSQL test cannot skip in CI
        env:
          HAUSV_TEST_POSTGRES_DSN: ""
        run: |
          if guard_output=$(go test ./internal/db -run '^TestPostgresTargetSchemaAndRLS$' 2>&1); then
            echo "RLS test unexpectedly passed without HAUSV_TEST_POSTGRES_DSN"
            exit 1
          fi
          echo "$guard_output"
          grep -Fq "HAUSV_TEST_POSTGRES_DSN is required" <<<"$guard_output"

      - name: Verify generated templ code
        run: |
          go install github.com/a-h/templ/cmd/templ@v0.3.1020
          templ generate
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Boot app on PostgreSQL
        run: go test ./internal/server -run '^TestBootsOnPostgres$' -count=1

      - name: Test (race)
        run: go test -race ./...

      - name: Build
        run: go build ./...

  govulncheck:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          check-latest: true
      - name: govulncheck
        run: |
          # Deliberately pinned: scanner upgrades are reviewed instead of
          # changing underneath an otherwise identical commit.
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck -version
          govulncheck ./...

  browser-role-qa:
    name: Focused browser smoke test
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # Keep the delivery loop short while rapid human review is active. Remove
    # the focused flags below to restore the broad resident/admin matrix.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.1 # exakte Patchversion, siehe docs/supply-chain-pins.md
          cache: npm
          cache-dependency-path: scripts/snapshot/package-lock.json

      - name: Verify fail-closed release contract
        run: |
          bash scripts/test-deploy.sh
          bash scripts/test-deploy-from-ci-image.sh

      - name: Check supply-chain pins
        run: python3 scripts/check-supply-chain-pins.py

      - name: Install browser QA dependencies
        run: |
          npm --prefix scripts/snapshot ci --ignore-scripts --no-audit --no-fund
          npm --prefix scripts/snapshot exec -- playwright install --with-deps chromium

      - name: Verify launched headless browser-QA versions
        working-directory: scripts/snapshot
        run: node verify-versions.mjs --strict

      - name: Run focused headless energy smoke test
        env:
          CI: "true"
          HV_QA_HEADLESS: "true"
          HV_QA_ENERGY_ONLY: "true"
          HV_QA_FAST: "true"
          HV_QA_LANDING_ONLY: "true"
          HV_QA_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/browser-role-qa
        run: bash scripts/qa-main-flows.sh

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-role-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/browser-role-qa
          if-no-files-found: warn
          retention-days: 7

  portal-oracles:
    name: Portal parity and responsive shell
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # Measured: the parity pass is 1m50s locally for 150 page captures, the
    # probe about a minute. This runner is slower, so the ceiling is generous
    # rather than tight — a timeout here reads as a product failure and costs
    # far more than the minutes it saves.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.1 # exakte Patchversion, siehe docs/supply-chain-pins.md
          cache: npm
          cache-dependency-path: scripts/snapshot/package-lock.json

      - name: Install browser QA dependencies
        run: |
          npm --prefix scripts/snapshot ci --ignore-scripts --no-audit --no-fund
          npm --prefix scripts/snapshot exec -- playwright install --with-deps chromium

      # Cheap and self-contained: one boot, 20 routes x 18 widths. Asserts that
      # every route has exactly one navigation at every width, that it sits at
      # the top, and that all routes agree on which shell they are in. Six
      # routes once rendered their only navigation below the fold and every
      # other check passed.
      # run.sh hands the output path straight to the probe, which writes a file
      # rather than creating a tree, so the directory has to exist first.
      - name: Prepare evidence directory
        run: mkdir -p "${{ github.workspace }}/artifacts/portal-oracles"

      - name: Responsive shell probe
        env:
          CI: "true"
          HV_CAPTURE: shell-widths.mjs
        run: bash scripts/snapshot/run.sh WORKTREE "${{ github.workspace }}/artifacts/portal-oracles/widths.json" 8299

      # The dual-renderer parity oracle was retired with the deleted renderer.
      # Keep a non-vacuous replacement: every route in the maintained
      # authenticated coverage list must return successfully, land on the
      # intended route, and carry its templ marker. Route-specific Go tests
      # cover authenticated subresources outside that browser list.
      - name: Covered authenticated routes use the surviving renderer
        env:
          CI: "true"
          HV_CAPTURE: templ-coverage.mjs
        run: bash scripts/snapshot/run.sh WORKTREE "${{ github.workspace }}/artifacts/portal-oracles/renderer.json" 8399

      - name: Upload oracle evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: portal-oracles-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/portal-oracles
          if-no-files-found: warn
          retention-days: 7

  docker:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      
      - name: Read VERSION
        id: version
        run: echo "app_version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      
      - name: Build image
        run: |
          docker build \
            --build-arg APP_VERSION="${{ steps.version.outputs.app_version }}" \
            --build-arg GIT_COMMIT="${GITHUB_SHA::7}" \
            -t hausv-org:ci \
            ./
      
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      
      - name: Push image to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          IMAGE_BASE="ghcr.io/inspr-at/hausv-org"
          COMMIT_SHORT="${GITHUB_SHA::7}"
          VERSION="${{ steps.version.outputs.app_version }}"
          
          # Tag with commit SHA (for digest-pinned pulls)
          docker tag hausv-org:ci "${IMAGE_BASE}:${GITHUB_SHA}"
          docker tag hausv-org:ci "${IMAGE_BASE}:${COMMIT_SHORT}"
          
          # Tag with release format (what deploy expects)
          docker tag hausv-org:ci "${IMAGE_BASE}:release-${VERSION}-${COMMIT_SHORT}"
          
          # Push all tags
          docker push "${IMAGE_BASE}:${GITHUB_SHA}"
          docker push "${IMAGE_BASE}:${COMMIT_SHORT}"
          docker push "${IMAGE_BASE}:release-${VERSION}-${COMMIT_SHORT}"
          
          # Output the digest for downstream use
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE_BASE}:${GITHUB_SHA}" | cut -d'@' -f2)
          echo "Pushed image digest: ${DIGEST}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
