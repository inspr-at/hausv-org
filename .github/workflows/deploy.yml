name: Deploy

# NOTE: This workflow builds and pushes the image to GHCR but does NOT deploy to production.
# Production deployment is manual via scripts/deploy.sh or scripts/deploy-from-ci-image.sh on csb1.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Git commit SHA (7 chars) to deploy'
        required: true
        type: string
      version:
        description: 'VERSION to deploy (e.g. 0.98.10)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    # Only deploy if CI succeeded (for workflow_run trigger)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.commit_sha || github.event.workflow_run.head_sha }}
      
      - name: Read VERSION
        id: version
        run: echo "app_version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      
      - name: Determine deploy parameters
        id: params
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "commit=${{ github.event.inputs.commit_sha }}" >> "$GITHUB_OUTPUT"
            echo "sha_full=${{ github.event.inputs.commit_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ steps.version.outputs.app_version }}" >> "$GITHUB_OUTPUT"
            echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "sha_full=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi
      
      # This workflow does NOT swap production. It only reports that the CI image is ready.
      # Production deployment is manual, using one of these methods:
      #
      # 1. On csb1: scripts/deploy-from-ci-image.sh <version> <commit>
      #    (Pulls the CI-built image from GHCR and swaps the container)
      #
      # 2. From dev machine: scripts/deploy.sh
      #    (Ships git archive to csb1, builds there, and swaps)
      #
      # Both scripts require:
      # - Private deploy.env loaded on the operator's machine or csb1
      # - GHCR authentication via /run/agenix/csb1-hausv-ghcr-pull token file
      # - All fail-closed preconditions (green CI, VERSION bump, health checks)
      
      - name: Report deploy readiness
        run: |
          echo "CI image ready for deployment:"
          echo "  Image: ghcr.io/inspr-at/hausv-org:release-${{ steps.params.outputs.version }}-${{ steps.params.outputs.commit }}"
          echo "  Version: ${{ steps.params.outputs.version }}"
          echo "  Commit: ${{ steps.params.outputs.commit }} (${{ steps.params.outputs.sha_full }})"
          echo ""
          echo "To deploy this image to production:"
          echo "  1. SSH to csb1"
          echo "  2. Load deploy.env: . ~/.config/hausv/deploy.env"
          echo "  3. Run: scripts/deploy-from-ci-image.sh ${{ steps.params.outputs.version }} ${{ steps.params.outputs.commit }}"
          echo ""
          echo "This workflow does NOT deploy to production automatically."
