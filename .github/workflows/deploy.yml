      #     HAUSV_DEPLOY_SSH_HOST: ${{ secrets.HAUSV_DEPLOY_SSH_HOST }}
      #     HAUSV_DEPLOY_SSH_PORT: ${{ secrets.HAUSV_DEPLOY_SSH_PORT || 22 }}
      #     HAUSV_DEPLOY_COMPOSE_DIR: ${{ secrets.HAUSV_DEPLOY_COMPOSE_DIR }}
      #     HAUSV_DEPLOY_COMPOSE_FILE: ${{ secrets.HAUSV_DEPLOY_COMPOSE_FILE }}
      #     HAUSV_DEPLOY_COMPOSE_PROJECT: ${{ secrets.HAUSV_DEPLOY_COMPOSE_PROJECT || 'hausv' }}
      #     HAUSV_DEPLOY_DATA_DIR: ${{ secrets.HAUSV_DEPLOY_DATA_DIR }}
      #     HAUSV_DEPLOY_SNAPSHOT_ROOT: ${{ secrets.HAUSV_DEPLOY_SNAPSHOT_ROOT }}
      #     HAUSV_DEPLOY_LIVE_URL: ${{ secrets.HAUSV_DEPLOY_LIVE_URL }}
